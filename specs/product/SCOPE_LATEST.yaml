initiative: restore-skhaz-blog
status: implemented
objective: >-
  Restore the historical skhaz.com/blog publication as a safe, portable static
  archive while preserving original URLs, content, comments, and provenance.
in_scope:
  - posts published from 2008-02-04 through 2009-04-09
  - the verified WordPress.com migration notice that announced skhaz.com, kept in a separate predecessor section
  - comments present in retrievable archive copies
  - original post, category, tag, month, feed, and index routes
  - recoverable media, broad public-archive forensics, and explicit placeholders for missing media
  - build-time C++ syntax highlighting with presentation-only four-space indentation
  - responsive adaptation of the final observed visual identity
out_of_scope:
  - reviving WordPress, its database, plugins, forms, or trackers
  - domain-parking pages captured after the blog disappeared
  - merging later nullonerror.org content into this historical archive
  - fabricating text, comments, dates, images, or metadata
acceptance:
  verify: npm test
  expected_posts: 35
  expected_predecessor_records: 1
  expected_complete_comments: 72
  expected_recorded_comments: 82
  expected_missing_media_markers: 11
  expected_missing_downloads: 3
  expected_highlighted_cpp_blocks: 38
prior_art:
  - candidate: Wayback Machine RSS and page captures
    verdict: adopt
    use: 29 complete posts, one partial post, comments, and URL evidence
  - candidate: Common Crawl ARC records
    verdict: compose
    use: five later posts and their comments
  - candidate: WordPress.com media archive
    verdict: compose
    use: original image binaries still available
  - candidate: 2008 Wayback capture of the WordPress.com predecessor
    verdict: preserve_separately
    use: contemporaneous migration notice announcing www.skhaz.com
  - candidate: current WordPress.com revision of the migration notice
    verdict: document_only
    use: revision provenance only; its later nullonerror destination is excluded from the restored corpus
  - candidate: ImageShack public profile and API
    verdict: document_only
    use: metadata for six missing images; legacy binary routes now return 404
  - candidate: iNove WordPress theme
    verdict: extend
    use: final observed visual identity, adapted for static responsive HTML
  - candidate: GitHub nullonerror repositories
    verdict: reject_for_scope
    reason: editorial continuation on a different domain and period
